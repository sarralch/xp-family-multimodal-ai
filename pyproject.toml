[project]
name = "xp-family"
version = "2.0.0"
description = "Multimodal RAG platform supporting Xeroderma Pigmentosum patients: cosmetic safety scanning, ingredient Q&A, XP-safe recipes and UV-aware appointment scheduling."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Sarra Lachheb" },
    { name = "Mohamed Iyed Lagha" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "google-genai>=1.0",
    "pillow>=10.4",
]

[project.optional-dependencies]
# Dense embeddings + cross-encoder reranker (pulls in torch; CPU wheels by default).
ml = ["sentence-transformers>=3.2", "torch>=2.4"]
ocr = ["pytesseract>=0.3.13"]
# Django UI: the three assistants + UV-aware scheduler.
web = ["django>=5.1,<6", "requests>=2.32", "pytz>=2024.2"]
scheduler = [
    "gtts>=2.5",
    "assemblyai>=0.34",
    "twilio>=9.3",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tensorflow-cpu>=2.17; sys_platform != 'darwin'",
    "tensorflow>=2.17; sys_platform == 'darwin'",
]
eval = ["ragas>=0.2", "langchain-google-genai>=2.0", "datasets>=3.0"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.7"]

[project.scripts]
xp-family-api = "xp_family.api.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xp_family"]

[tool.uv]
# Keep torch on CPU wheels: the models here are small and Docker images stay lean.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # French text in prompts uses typographic characters

[tool.ruff.lint.per-file-ignores]
"src/xp_family/prompts.py" = ["E501"]  # prompt prose reads better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient"]
